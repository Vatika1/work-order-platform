services:
  postgres:
    image: postgres:16-alpine
    container_name: wop-postgres
    environment:
      POSTGRES_DB: workorder
      POSTGRES_USER: workorder
      POSTGRES_PASSWORD: workorder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workorder"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wop-redis
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3
    container_name: wop-localstack
    environment:
      SERVICES: s3,dynamodb
      DEFAULT_REGION: ca-central-1
    ports:
      - "4566:4566"
    volumes:
      - localstack:/var/lib/localstack

volumes:
  pgdata:
  localstack: