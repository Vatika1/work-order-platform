spring:
  application:
    name: work-order-platform
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cache:
    type: caffeine

server:
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  health:
    redis:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-local-dev-secret-at-least-32-bytes-long!!}
    issuer: work-order-platform
    access-ttl: 15m
    refresh-ttl: 7d
  aws:
    region: ${AWS_REGION:ca-central-1}
    s3:
      bucket: ${APP_S3_BUCKET:vatika-work-order-staging-files}
      presign-ttl: 10m